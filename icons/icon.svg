<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5364;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#203a43;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>

  <!-- GIF icon (left side) -->
  <g transform="translate(80, 140)">
    <!-- GIF rectangle -->
    <rect x="0" y="0" width="140" height="100" rx="12" fill="#ffffff" opacity="0.9"/>
    <text x="70" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2c5364" text-anchor="middle">GIF</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(256, 190)" fill="#10b981">
    <path d="M -20,-15 L 20,0 L -20,15 Z"/>
  </g>

  <!-- MP4 icon (right side) -->
  <g transform="translate(292, 140)">
    <!-- Video rectangle with play button -->
    <rect x="0" y="0" width="140" height="100" rx="12" fill="#ffffff" opacity="0.9"/>
    <!-- Play button -->
    <circle cx="70" cy="35" r="18" fill="#10b981"/>
    <path d="M 64,26 L 64,44 L 78,35 Z" fill="#ffffff"/>
    <text x="70" y="85" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c5364" text-anchor="middle">MP4</text>
  </g>

  <!-- Bottom accent -->
  <circle cx="256" cy="380" r="30" fill="#10b981" opacity="0.3"/>
</svg>
