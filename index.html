<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIF to Video Converter</title>
    <meta
      name="description"
      content="Convert your GIF animations to MP4 videos"
    />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2c5364" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Gif2Vid" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a
          href="https://github.com/shaneosullivan/gif2vid-site"
          target="_blank"
          rel="noopener"
          class="github-link"
          aria-label="View source on GitHub"
        >
          <img src="images/github.svg" alt="GitHub" class="github-icon" />
        </a>
        <h1 class="title">GIF to Video Converter</h1>
        <p class="subtitle">Convert your GIF animations to MP4 videos</p>
      </header>

      <main class="main-content">
        <section class="upload-section">
          <div class="file-input-wrapper">
            <input
              type="file"
              id="gifFile"
              accept=".gif,image/gif"
              class="file-input"
            />
            <label for="gifFile" class="file-label">
              <svg
                class="upload-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span class="file-label-text">Choose GIF File</span>
              <span class="file-label-hint">or drag and drop</span>
            </label>
          </div>

          <div id="status" class="status info">Initializing...</div>
        </section>

        <section id="output" class="output-section">
          <!-- Converted video and download link will appear here -->
        </section>
      </main>

      <footer class="footer">
        <p>
          Built by
          <a href="https://chofter.com" target="_blank" rel="noopener"
            >Shane O'Sullivan</a
          >
        </p>
        <p>
          Powered by
          <a
            href="https://www.npmjs.com/package/gif2vid"
            target="_blank"
            rel="noopener"
            >gif2vid</a
          >
        </p>
      </footer>
    </div>

    <script type="module" src="dist/main.js"></script>
  </body>
</html>
